name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - develop
      - aisacms
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: ⚡ Fast Test, Build & Push (GHCR)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://placeholder:placeholder@localhost:5432/placeholder"
      NEXTAUTH_SECRET: "ci-secret-placeholder-must-be-long-enough-32char"
      INFRA_ENCRYPTION_KEY: "ci-infra-key-placeholder-32-characters-key"
      NEXTAUTH_URL: "http://localhost:3000"
      SKIP_SENTRY_BUILD: "1"
      SENTRY_IGNORE_API_RESOLUTION_ERROR: "1"
      SENTRY_DISABLE_SERVER_SIDE_SOURCE_MAPS: "1"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies (Cached)
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bun x prisma generate

      - name: Run Automated Vitest Suite (155 tests)
        run: bun run test

      - name: Compile Next.js Standalone Bundle
        run: bun run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata & Tags
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sacms
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/aisacms' }}

      - name: Build & Push Ultra-Fast Image (5s)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: 🚀 Live Zero-Downtime Deploy (164.68.116.79)
    needs: [build-and-push]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/aisacms'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ensure Target Directory Exists on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || '164.68.116.79' }}
          username: ${{ secrets.SERVER_USER || secrets.SSH_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY || secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SERVER_PASSWORD || secrets.SSH_PASSWORD || secrets.SERVER_PASS }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 60s
          command_timeout: 10m
          script: |
            mkdir -p /opt/sacms/db/backups
            mkdir -p /opt/sacms/caddy_data
            mkdir -p /opt/sacms/caddy_config

      - name: Sync Compose and Caddy Config to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST || '164.68.116.79' }}
          username: ${{ secrets.SERVER_USER || secrets.SSH_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY || secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SERVER_PASSWORD || secrets.SSH_PASSWORD || secrets.SERVER_PASS }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 60s
          command_timeout: 10m
          source: "docker-compose.yml,Caddyfile"
          target: "/opt/sacms"

      - name: Execute Zero-Downtime Deployment & DB Migration
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_CONTENT: ${{ secrets.ENV_PRODUCTION }}
        with:
          host: ${{ secrets.SERVER_HOST || '164.68.116.79' }}
          username: ${{ secrets.SERVER_USER || secrets.SSH_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY || secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          password: ${{ secrets.SERVER_PASSWORD || secrets.SSH_PASSWORD || secrets.SERVER_PASS }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 60s
          command_timeout: 30m
          envs: ENV_CONTENT
          script: |
            set -e
            echo "==> [1/7] Checking Docker environment..."
            if ! command -v docker &> /dev/null; then
              echo "Error: Docker is not installed on this server. Run scripts/vps-setup.sh first."
              exit 1
            fi

            cd /opt/sacms

            echo "==> [2/7] Syncing Environment Configuration..."
            if [ -n "$ENV_CONTENT" ]; then
              echo "$ENV_CONTENT" > /opt/sacms/.env
              chmod 600 /opt/sacms/.env
              echo "✅ Successfully synced /opt/sacms/.env from GitHub Secrets (ENV_PRODUCTION)."
            elif [ ! -f /opt/sacms/.env ]; then
              echo "⚠️ Warning: /opt/sacms/.env not found on server and ENV_PRODUCTION secret not configured."
              echo "Please set up /opt/sacms/.env or add ENV_PRODUCTION to GitHub Secrets."
            else
              echo "ℹ️ Preserving existing /opt/sacms/.env on server."
            fi

            # Prioritize IPv4 on Contabo VPS to prevent IPv6 connection reset drops on large GHCR image layers
            if [ -f /etc/gai.conf ]; then
              sed -i 's/#precedence ::ffff:0:0\/96  100/precedence ::ffff:0:0\/96  100/' /etc/gai.conf 2>/dev/null || true
            else
              echo "precedence ::ffff:0:0/96  100" > /etc/gai.conf 2>/dev/null || true
            fi

            echo "==> [3/7] Authenticating to GHCR..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "==> [4/7] Pulling latest SaCMS image (with auto-retry)..."
            PULL_SUCCESS=0
            for attempt in 1 2 3 4 5; do
              echo "Pull attempt $attempt/5..."
              if docker compose pull app; then
                PULL_SUCCESS=1
                echo "✅ SaCMS image pulled successfully."
                break
              fi
              echo "⚠️ Pull attempt $attempt failed (network glitch). Resuming in 4s..."
              sleep 4
            done
            if [ "$PULL_SUCCESS" -ne 1 ]; then
              echo "❌ Error: Failed to pull SaCMS image after 5 attempts."
              exit 1
            fi

            echo "==> [5/7] Running Prisma Database Migrations & Permission Sync..."
            # Ensure postgres & redis are up and healthy first
            docker compose up -d postgres redis
            for i in $(seq 1 15); do
              if docker compose exec -T postgres pg_isready -q 2>/dev/null; then
                echo "PostgreSQL is ready!"
                break
              fi
              echo "Waiting for PostgreSQL ($i/15)..."
              sleep 2
            done

            # Auto-sync PostgreSQL user & password from .env to volume database
            DB_USER=$(grep -E '^POSTGRES_USER=' /opt/sacms/.env 2>/dev/null | head -n1 | cut -d '=' -f2- | tr -d '"' | tr -d "'" || echo "sacms")
            DB_PASS=$(grep -E '^POSTGRES_PASSWORD=' /opt/sacms/.env 2>/dev/null | head -n1 | cut -d '=' -f2- | tr -d '"' | tr -d "'" || true)
            if [ -z "$DB_PASS" ]; then
              DB_PASS=$(grep -E '^DATABASE_URL=' /opt/sacms/.env 2>/dev/null | head -n1 | sed -E 's|.*://[^:]+:([^@]+)@.*|\1|' || true)
            fi
            if [ -z "$DB_USER" ]; then
              DB_USER="sacms"
            fi
            if [ -n "$DB_PASS" ]; then
              echo "==> Synchronizing PostgreSQL credentials for '$DB_USER' to match .env..."
              docker compose exec -T postgres psql -U postgres -d template1 -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = '$DB_USER') THEN CREATE ROLE \"$DB_USER\" WITH SUPERUSER LOGIN PASSWORD '$DB_PASS'; ELSE ALTER USER \"$DB_USER\" WITH PASSWORD '$DB_PASS'; END IF; END \$\$;" 2>/dev/null || \
              docker compose exec -T postgres psql -U "$DB_USER" -d template1 -c "ALTER USER \"$DB_USER\" WITH PASSWORD '$DB_PASS';" 2>/dev/null || \
              docker compose exec -T postgres psql -c "ALTER USER \"$DB_USER\" WITH PASSWORD '$DB_PASS';" 2>/dev/null || true
            fi

            # Run Prisma schema push & RBAC permission sync
            docker compose run --rm app bun x prisma db push --accept-data-loss --skip-generate
            docker compose run --rm app bun run seed:permissions || true

            echo "==> [6/7] Starting all services (Zero-downtime rolling update)..."
            docker compose up -d --remove-orphans

            echo "==> [7/7] Verifying live system health..."
            HEALTHY=0
            for i in $(seq 1 20); do
              HEALTH_RES=$(curl -sf http://127.0.0.1:3000/api/health 2>/dev/null || echo "")
              if echo "$HEALTH_RES" | grep -q '"status":"healthy"'; then
                echo "✅ SaCMS App, Database & Services are 100% HEALTHY! 🚀"
                HEALTHY=1
                break
              elif echo "$HEALTH_RES" | grep -q '"database":{"status":"ok"}'; then
                echo "✅ SaCMS Database is connected and healthy!"
                HEALTHY=1
                break
              fi
              echo "Waiting for app health check ($i/20)..."
              sleep 3
            done

            if [ "$HEALTHY" -ne 1 ]; then
              echo "⚠️ Warning: Healthcheck did not return healthy within 60s. Recent app logs:"
              docker compose logs --tail=30 app
            fi

            echo "==> Cleaning up unused images..."
            docker image prune -f

            echo "========================================================"
            echo "🎉 Deployment to 164.68.116.79 completed successfully!"
            echo "Domain: https://sacms.cloud"
            echo "========================================================"
