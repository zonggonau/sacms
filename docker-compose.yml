services:
  app:
    image: ghcr.io/zonggonau/sacms:latest
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      # src/lib/redis.ts only ever speaks the Upstash REST protocol (by
      # design, for edge-runtime compatibility) — it never connects to the
      # `redis` service's redis:// port directly. Without this, that
      # container ran fully wired up (healthcheck, depends_on) but nothing
      # in the app ever talked to it, so anything gated on getRedis() being
      # non-null (e.g. custom-domain routing in proxy.ts) silently behaved
      # as if Redis were unconfigured. `srh` below is a tiny REST shim in
      # front of the same `redis` container, so the existing Upstash client
      # code needs no changes. If .env already sets real Upstash Cloud
      # credentials, those win here — this is only the fallback.
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-http://srh:80}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-sacms-local-srh-token}
    # Without a cap, the app container under heavy/runaway load (e.g. a
    # traffic spike, a memory leak) can starve postgres/redis sharing the
    # same VPS instead of just failing on its own. Tune to the VPS's real
    # size via APP_MEM_LIMIT/APP_CPU_LIMIT in .env — these are conservative
    # defaults, not a measured ceiling.
    mem_limit: ${APP_MEM_LIMIT:-1g}
    cpus: ${APP_CPU_LIMIT:-1.5}
    volumes:
      # Persist locally-stored media (used whenever R2/S3 isn't configured,
      # see lib/r2.ts's uploadToLocal) across redeploys/container
      # recreation — without this, every push that triggers a new container
      # wipes every previously uploaded file, since it only ever lived on
      # that one container's disk.
      - media_uploads:/app/public/upload
    # scripts/healthcheck.js is baked into the image at build time
    # (Dockerfile: `COPY scripts ./scripts`) — it used to ALSO be bind-
    # mounted from the host here, which was pure redundancy with a real
    # cost: every deploy's scp step replaces the host file with a new
    # inode while THIS deploy's container is still running the old build,
    # orphaning its view of the bind (shows as "(deleted)"). Docker's own
    # healthcheck then fails forever until the container is recreated —
    # and `docker compose up -d` hangs trying to gracefully stop a
    # container Docker itself considers unhealthy, repeatedly timing out
    # today's deploys at the SSH step's 30-minute limit. Confirmed live
    # twice. Removing the bind mount removes the staleness entirely; the
    # container always runs the healthcheck script baked into its own
    # image, immune to host-side file changes after it starts.
    healthcheck:
      test: ["CMD", "bun", "scripts/healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      srh:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sacms}
      # No weak fallback — compose refuses to start rather than silently
      # running Postgres with a known-public default password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-sacms}
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    cpus: ${POSTGRES_CPU_LIMIT:-1.5}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sacms} -d ${POSTGRES_DB:-sacms}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    cpus: ${REDIS_CPU_LIMIT:-0.5}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Upstash-REST-protocol shim in front of the `redis` container above, so
  # @upstash/redis (what src/lib/redis.ts actually uses) works against this
  # self-hosted Redis without any application code change. See the `app`
  # service's UPSTASH_REDIS_REST_URL/TOKEN comment for why this exists.
  srh:
    image: hiett/serverless-redis-http:latest
    environment:
      SRH_MODE: env
      SRH_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-sacms-local-srh-token}
      SRH_CONNECTION_STRING: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    profiles:
      - docker-caddy
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # Database backup — runs daily at 2am
  db-backup:
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-sacms}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — see .env.example}
      PGDATABASE: ${POSTGRES_DB:-sacms}
      # Optional offsite copy — a VPS-local-only backup is lost together
      # with the VPS it backs up. Leave BACKUP_S3_BUCKET empty to keep
      # backups local-only (previous behavior, unchanged). Deliberately a
      # separate bucket/credential from the S3_* media storage vars, so a
      # compromised media key can't also reach backups.
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-auto}
    volumes:
      - ./db/backups:/backups
    entrypoint: >
      sh -c '
        if [ -n "$$BACKUP_S3_BUCKET" ]; then
          apk add --no-cache aws-cli >/dev/null 2>&1
          export AWS_ACCESS_KEY_ID="$$BACKUP_S3_ACCESS_KEY_ID"
          export AWS_DEFAULT_REGION="$$BACKUP_S3_REGION"
          export AWS_SECRET_ACCESS_KEY="$$BACKUP_S3_SECRET_ACCESS_KEY"
        fi
        while true; do
          STAMP=$$(date +%Y%m%d_%H%M%S)
          FILE=/backups/sacms_$$STAMP.dump
          pg_dump -Fc > "$$FILE"
          # Keep only last 7 daily backups locally
          ls -t /backups/sacms_*.dump | tail -n +8 | xargs rm -f 2>/dev/null
          echo "[$$STAMP] Local backup complete"
          if [ -n "$$BACKUP_S3_BUCKET" ]; then
            if aws s3 cp "$$FILE" "s3://$$BACKUP_S3_BUCKET/sacms_$$STAMP.dump" --endpoint-url "$$BACKUP_S3_ENDPOINT" >/dev/null 2>&1; then
              echo "[$$STAMP] Offsite copy uploaded to $$BACKUP_S3_BUCKET"
            else
              echo "[$$STAMP] WARNING: offsite upload failed — local backup is still safe, but this backup has no offsite copy"
            fi
          fi
          sleep 86400
        done
      '
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Object storage for workspace media: bucket sacms-media, one folder per workspace id.
  # Enabled with COMPOSE_PROFILES=storage; served publicly through Caddy at media.sacms.cloud.
  #
  # quay.io/minio/minio + quay.io/minio/mc now return 401 to EVERY pull,
  # anonymous or authenticated with a fresh token — confirmed live, not a
  # deleted-tag issue. MinIO privatized those legacy repos. The official
  # successor, quay.io/minio/aistor/minio, pulls fine but is MinIO's
  # commercial product — confirmed live it refuses every S3 operation
  # ("No valid license found, running in offline mode") with no license
  # key, so it's not a drop-in free replacement. Using bitnamilegacy's
  # frozen (unmaintained but genuinely open-source, no license wall)
  # MinIO build instead — confirmed pullable anonymously. Healthcheck
  # switched from `mc ready local` to the server's own built-in
  # /minio/health/live HTTP endpoint, since bitnamilegacy's image isn't
  # confirmed to bundle the mc CLI the official image did.
  minio:
    profiles:
      - storage
    image: bitnamilegacy/minio:latest
    # Bitnami's image drops to a non-root UID that can't write our plain
    # /data bind (its own auto-chown only covers Bitnami's documented
    # /bitnami/* paths) — confirmed live ("file access denied, drive may
    # be faulty") even against a brand-new empty volume. This service is
    # internal-only (127.0.0.1, reached only through Caddy), so running
    # it as root to sidestep the permission mismatch is low-risk.
    user: root
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Creates the media bucket (public read) and the app's own access key. Idempotent.
  minio-init:
    profiles:
      - storage
    image: bitnamilegacy/minio-client:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      S3_BUCKET: ${S3_BUCKET:-sacms-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    entrypoint: >
      sh -c '
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing --region us-east-1 "local/$$S3_BUCKET"
        mc anonymous set download "local/$$S3_BUCKET"
        mc admin user add local "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY"
        mc admin policy attach local readwrite --user "$$S3_ACCESS_KEY_ID" || true
      '
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # Scheduled calls to the app's cron routes (Authorization: Bearer CRON_SECRET).
  # Enabled with COMPOSE_PROFILES=cron once CRON_SECRET is in .env.
  cron:
    profiles:
      - cron
    image: alpine:3.20
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    volumes:
      - ./docker/cron/crontab:/etc/crontabs/root:ro
    entrypoint: ["sh", "-c", "apk add --no-cache curl >/dev/null && printenv | grep ^CRON_SECRET= > /etc/cron.env && exec crond -f -l 6"]
    depends_on:
      - app
    restart: unless-stopped

volumes:
  minio_data:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  media_uploads:
