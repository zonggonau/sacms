services:
  app:
    image: ghcr.io/zonggonau/sacms:latest
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    volumes:
      - ./scripts/healthcheck.js:/app/scripts/healthcheck.js:ro
      # Persist locally-stored media (used whenever R2/S3 isn't configured,
      # see lib/r2.ts's uploadToLocal) across redeploys/container
      # recreation — without this, every push that triggers a new container
      # wipes every previously uploaded file, since it only ever lived on
      # that one container's disk.
      - media_uploads:/app/public/upload
    healthcheck:
      test: ["CMD", "bun", "scripts/healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sacms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Z0ngg0n4U}
      POSTGRES_DB: ${POSTGRES_DB:-sacms}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sacms} -d ${POSTGRES_DB:-sacms}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  caddy:
    profiles:
      - docker-caddy
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # Database backup — runs daily at 2am
  db-backup:
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-sacms}
      PGPASSWORD: ${POSTGRES_PASSWORD:-Z0ngg0n4U}
      PGDATABASE: ${POSTGRES_DB:-sacms}
    volumes:
      - ./db/backups:/backups
    entrypoint: >
      sh -c '
        while true; do
          STAMP=$$(date +%Y%m%d_%H%M%S)
          pg_dump -Fc > /backups/sacms_$$STAMP.dump
          # Keep only last 7 daily backups
          ls -t /backups/sacms_*.dump | tail -n +8 | xargs rm -f 2>/dev/null
          echo "[$$STAMP] Backup complete"
          sleep 86400
        done
      '
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Object storage for workspace media: bucket sacms-media, one folder per workspace id.
  # Enabled with COMPOSE_PROFILES=storage; served publicly through Caddy at media.sacms.cloud.
  minio:
    profiles:
      - storage
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Creates the media bucket (public read) and the app's own access key. Idempotent.
  minio-init:
    profiles:
      - storage
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      S3_BUCKET: ${S3_BUCKET:-sacms-media}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    entrypoint: >
      sh -c '
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing --region us-east-1 "local/$$S3_BUCKET"
        mc anonymous set download "local/$$S3_BUCKET"
        mc admin user add local "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY"
        mc admin policy attach local readwrite --user "$$S3_ACCESS_KEY_ID" || true
      '
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # Scheduled calls to the app's cron routes (Authorization: Bearer CRON_SECRET).
  # Enabled with COMPOSE_PROFILES=cron once CRON_SECRET is in .env.
  cron:
    profiles:
      - cron
    image: alpine:3.20
    environment:
      CRON_SECRET: ${CRON_SECRET:-}
    volumes:
      - ./docker/cron/crontab:/etc/crontabs/root:ro
    entrypoint: ["sh", "-c", "apk add --no-cache curl >/dev/null && printenv | grep ^CRON_SECRET= > /etc/cron.env && exec crond -f -l 6"]
    depends_on:
      - app
    restart: unless-stopped

volumes:
  minio_data:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  media_uploads:
